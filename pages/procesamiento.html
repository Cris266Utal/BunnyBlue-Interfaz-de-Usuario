<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procesamiento de Pedido | BunnyBlue</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pedidos.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script>BB.guard("admin");</script>
</head>
<body data-page="procesamiento.html">
  <div id="head"></div>
  <main>
    <h1>Procesamiento de Pedido</h1>
    <p class="paso" id="paso" aria-live="polite"></p>
    <section id="paso1">
      <div class="pcards" id="tarjetas"></div>
      <p class="pendiente" id="vacio" hidden>No hay pedidos pendientes de procesar.</p>
      <div class="barra centro"><button class="btn" id="procesar" type="button" disabled>Procesar</button></div>
    </section>
    <section id="paso2" hidden>
      <div class="dos-col">
        <section class="tarjeta" aria-labelledby="t-cli">
          <h2 id="t-cli">Datos del cliente</h2>
          <dl class="datos" id="datos"></dl>
        </section>
        <section class="tarjeta" aria-labelledby="t-det">
          <h2 id="t-det">Detalle del pedido</h2>
          <div class="tabla-scroll"><table>
            <thead><tr><th>CANTIDAD</th><th>PRODUCTO</th><th>VALOR UNITARIO</th><th>VALOR VENTA</th></tr></thead>
            <tbody id="det"></tbody>
          </table></div>
          <p class="total">Total: <strong id="total"></strong></p>
        </section>
      </div>
      <section class="tarjeta" style="margin-top:24px">
        <div class="decision">
          <div class="campo"><label for="vb">VISTO BUENO</label><select id="vb"><option value="">Seleccionar…</option><option>Sí</option><option>No</option></select></div>
          <div class="campo"><label for="dest">ENVIAR A</label><select id="dest" disabled><option value="">Primero elige el visto bueno</option></select></div>
        </div>
        <div class="acciones centro"><button class="btn sec" id="volver" type="button">Volver</button><button class="btn" id="aceptar" type="button" disabled>Aceptar</button></div>
      </section>
    </section>
  </main>
  <div id="foot"></div>
  <script src="../js/layout.js"></script>
  <script src="../js/procesamiento.js"></script>
</body>
</html>
