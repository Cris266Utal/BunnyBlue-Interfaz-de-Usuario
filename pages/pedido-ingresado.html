<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido Ingresado | BunnyBlue</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pedidos.css">
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script>BB.guard("user");</script>
</head>
<body data-page="pedido-ingresado.html">
  <div id="head"></div>
  <main>
    <h1>Pedidos ingresados</h1>
    <div class="barra"><button class="btn" id="editar" type="button" disabled>Editar</button><button class="btn peligro" id="eliminar" type="button" disabled>Eliminar</button></div>
    <section class="tarjeta">
      <div class="tabla-scroll"><table class="tabla-lista">
        <thead><tr><th><span class="sr">Sel.</span></th><th>N.º PEDIDO</th><th>NOMBRE COMPLETO</th><th>CORREO</th><th>TELÉFONO</th><th class="num">TOTAL</th></tr></thead>
        <tbody id="lista"></tbody>
      </table></div>
      <p class="pendiente" id="vacio" hidden>No hay pedidos ingresados.</p>
    </section>
  </main>
  <div id="foot"></div>
  <script src="../js/layout.js"></script>
  <script src="../js/pedido-ingresado.js"></script>
</body>
</html>
