<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido Ingresado | BunnyBlue</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pedidos.css">
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script>BB.guard("user");</script>
</head>
<body data-page="pedido-ingresado.html">
  <div id="head"></div>
  <main class="m-lista">
    <h1>Pedidos ingresados</h1>
    <div class="tabla-scroll"><table class="tabla-lista">
      <thead><tr><th><span class="sr">Seleccionar</span></th><th>N° pedido</th><th>Nombre completo</th><th>Correo</th><th>Teléfono</th><th>Total</th></tr></thead>
      <tbody id="lista"></tbody>
    </table></div>
    <p class="vacio-msg" id="vacio" hidden>Aún no hay pedidos ingresados. Crea uno en la vista Pedidos.</p>
    <div class="barra-centro"><button class="btn contorno" id="editar" type="button" disabled>Editar</button><button class="btn peligro" id="eliminar" type="button" disabled>Eliminar</button></div>
  </main>
  <div id="foot"></div>
  <script src="../js/layout.js"></script>
  <script src="../js/pedido-ingresado.js"></script>
</body>
</html>
