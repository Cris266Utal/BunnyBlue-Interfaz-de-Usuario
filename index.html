<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | BunnyBlue</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body data-page="index.html">
  <div id="head"></div>
  <main>
    <section class="tarjeta login">
      <h1>Iniciar sesión</h1>
      <form id="form-login" novalidate>
        <label for="usuario">USUARIO</label>
        <input id="usuario" type="text" autocomplete="username" placeholder="Ej.: camila" required>
        <label for="clave">CONTRASEÑA</label>
        <input id="clave" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
        <button id="btn-ingresar" class="btn" type="submit">Ingresar</button>
      </form>
    </section>
  </main>
  <div id="foot"></div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
