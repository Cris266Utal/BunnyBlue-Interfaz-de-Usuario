<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | BunnyBlue</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body data-page="index.html">
  <div id="head"></div>
  <main class="m-login">
    <section class="tarjeta login" aria-labelledby="t-login">
      <h1 id="t-login">Iniciar sesión</h1>
      <form id="form-login" novalidate>
        <div class="campo"><label for="usuario">Usuario</label><input id="usuario" type="text" autocomplete="username" placeholder="Ej: jmartins" required></div>
        <div class="campo"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required></div>
      </form>
    </section>
    <div class="login-acc"><button id="btn-ingresar" class="btn grande" type="submit" form="form-login">Ingresar</button></div>
  </main>
  <div id="foot"></div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
